<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>刷题练习 - 300题</title>
    <style>
        /* ===== CSS 变量 ===== */
        :root {
            --c-primary: #5b8a72;
            --c-primary-light: #e8f5e9;
            --c-primary-lighter: #edf7ee;
            --c-warm: #d4915e;
            --c-warm-light: #fdf3ec;
            --c-warm-dark: #6b4c30;
            --c-bg: #f0ebe3;
            --c-card: #faf8f5;
            --c-border: #e0dbd4;
            --c-border-light: #ddd6cc;
            --c-text: #3a3632;
            --c-text-muted: #6b665f;
            --c-text-sub: #8a847c;
            --c-text-num: #999;
            --r-sm: 4px;
            --r-md: 8px;
            --r-lg: 12px;
            --r-pill: 14px;
            --r-full: 16px;
        }

        /* ===== Reset ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--c-bg); min-height: 100vh; display: flex; flex-direction: column;
        }

        /* ===== 顶部导航 ===== */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--c-primary); color: #fff;
            padding: 12px 16px; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header-controls { display: flex; align-items: center; gap: 12px; }
        .toggle-answer { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
        .toggle-answer input { width: 18px; height: 18px; cursor: pointer; }

        /* ===== 模式切换 ===== */
        .mode-switch {
            display: flex; background: rgba(255,255,255,.2);
            border-radius: var(--r-md); overflow: hidden;
        }
        .mode-btn {
            padding: 6px 12px; font-size: 13px;
            color: rgba(255,255,255,.8); border: none;
            background: transparent; cursor: pointer;
            transition: all .2s; white-space: nowrap;
        }
        .mode-btn.active { background: rgba(255,255,255,.3); color: #fff; font-weight: 600; }

        /* ===== 筛选栏（知识点/搜索共用基础） ===== */
        .filter-bar {
            position: fixed; top: 48px; left: 0; right: 0; z-index: 99;
            background: var(--c-card); border-bottom: 1px solid var(--c-border);
            padding: 8px 12px; display: none;
        }
        .filter-bar.show { display: flex; }
        .kp-bar { overflow-x: auto; white-space: nowrap; gap: 8px; align-items: center; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .kp-bar::-webkit-scrollbar { display: none; }
        .kp-bar .kp-label { font-size: 13px; color: var(--c-text-sub); font-weight: 500; flex-shrink: 0; }
        .kp-chip {
            display: inline-block; padding: 5px 12px; border-radius: var(--r-pill); font-size: 12px;
            border: 1px solid var(--c-border-light); background: #fff; color: var(--c-text-muted);
            cursor: pointer; transition: all .2s; flex-shrink: 0; white-space: nowrap;
        }
        .kp-chip.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
        .kp-chip .kp-count { font-size: 11px; opacity: .7; margin-left: 3px; }

        /* 搜索栏 */
        .search-bar { align-items: center; gap: 8px; }
        .search-input {
            flex: 1; padding: 8px 12px; border: 1px solid var(--c-border-light);
            border-radius: var(--r-md); font-size: 14px; background: #fff; outline: none;
        }
        .search-input:focus { border-color: var(--c-primary); }
        .search-count { font-size: 12px; color: var(--c-text-sub); white-space: nowrap; }
        .search-clear {
            padding: 6px 12px; background: #e8e2da; border: none;
            border-radius: var(--r-sm); font-size: 12px; color: var(--c-text-muted); cursor: pointer;
        }

        /* ===== 跳转弹窗 ===== */
        .jump-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
            display: none; justify-content: center; align-items: center;
        }
        .jump-modal.show { display: flex; }
        .jump-content { background: var(--c-card); border-radius: var(--r-lg); padding: 20px; width: 280px; }
        .jump-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; }
        .jump-input {
            width: 100%; padding: 12px; border: 1px solid var(--c-border-light);
            border-radius: var(--r-md); font-size: 16px; text-align: center;
            margin-bottom: 16px; background: #fff;
        }
        .jump-buttons { display: flex; gap: 12px; }
        .jump-btn { flex: 1; padding: 10px; border: none; border-radius: var(--r-md); font-size: 14px; cursor: pointer; }
        .jump-btn.confirm { background: var(--c-primary); color: #fff; }
        .jump-btn.cancel { background: #e8e2da; color: var(--c-text-muted); }

        /* ===== 主内容 ===== */
        .main-content { flex: 1; padding: 70px 12px 80px; overflow-y: auto; transition: padding-top .2s; }
        .kp-active .main-content { padding-top: 96px; }

        /* ===== 统计 ===== */
        .stats {
            background: var(--c-card); padding: 12px; border-radius: var(--r-md);
            margin-bottom: 12px; display: flex; justify-content: space-around;
            font-size: 14px; color: var(--c-text-muted);
        }
        .stats span { display: flex; align-items: center; gap: 4px; }
        .stats .count { color: var(--c-primary); font-weight: 600; }

        /* ===== 题目卡片 ===== */
        .question-card {
            background: var(--c-card); border-radius: var(--r-lg); padding: 16px;
            margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.04);
        }
        .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .question-type { display: inline-block; padding: 4px 10px; border-radius: var(--r-sm); font-size: 12px; font-weight: 500; }
        .type-choice { background: var(--c-primary-light); color: var(--c-primary); }
        .type-judge { background: #fff3e0; color: var(--c-warm); }
        .question-number { color: var(--c-text-num); font-size: 14px; }
        .question-title { font-size: 16px; color: var(--c-text); line-height: 1.6; margin-bottom: 16px; white-space: pre-wrap; }

        /* ===== 选项 ===== */
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option {
            display: flex; align-items: flex-start; padding: 12px;
            border: 1px solid var(--c-border); border-radius: var(--r-md);
            cursor: pointer; transition: all .2s; font-size: 15px; line-height: 1.5;
        }
        .option:hover { border-color: var(--c-primary); background: var(--c-bg); }
        .option.selected { border-color: var(--c-primary); background: var(--c-primary-light); }
        .option.correct, .option.user-correct { border-color: #7cb48a; background: var(--c-primary-lighter); }
        .option.wrong, .option.user-wrong { border-color: var(--c-warm); background: var(--c-warm-light); }

        /* 隐藏答案模式 */
        .hide-answer .option.correct, .hide-answer .option.wrong {
            border-color: var(--c-border); background: transparent;
        }
        .hide-answer .option.correct .option-label, .hide-answer .option.correct .option-content,
        .hide-answer .option.wrong .option-label, .hide-answer .option.wrong .option-content {
            color: var(--c-text);
        }
        .hide-answer .option.user-correct { border-color: #7cb48a !important; background: var(--c-primary-lighter) !important; }
        .hide-answer .option.user-wrong { border-color: var(--c-warm) !important; background: var(--c-warm-light) !important; }

        .option-label { font-weight: 600; margin-right: 10px; color: var(--c-text); min-width: 24px; }
        .option-content { flex: 1; color: var(--c-text); }

        /* ===== 答案区域 ===== */
        .answer-section { margin-top: 16px; padding: 12px; background: #f5f0ea; border-radius: var(--r-md); display: none; }
        .answer-section.show { display: block; }
        .answer-label { font-size: 14px; color: var(--c-primary); font-weight: 600; margin-bottom: 4px; }
        .answer-text { font-size: 15px; color: var(--c-text); }

        /* 答案子区域（记忆要点 / 解析）共用基础 */
        .answer-note {
            display: block; margin-top: 8px; padding: 6px 12px;
            border-left: 4px solid; border-radius: 0 var(--r-md) var(--r-md) 0;
            font-size: 13px; line-height: 1.6;
        }
        .answer-keyword {
            background: linear-gradient(135deg, #f5f0ea, #ede7df);
            border-left-color: var(--c-warm); color: var(--c-warm-dark); font-weight: 600;
            letter-spacing: .3px; word-break: break-all;
        }
        .answer-keyword::before { content: "\1F4A1 记忆: "; font-weight: 700; color: #8b6340; }
        .answer-analysis {
            background: linear-gradient(135deg, var(--c-primary-light), var(--c-primary-lighter));
            border-left-color: var(--c-primary); color: #3a5a45;
        }
        .answer-analysis::before { content: "\1F4DD 解析: "; font-weight: 700; color: #3a6b4a; }

        /* ===== 底部导航 ===== */
        .footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, var(--c-card), var(--c-bg)); padding: 10px 12px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 0));
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 -4px 20px rgba(0,0,0,.04); z-index: 100;
        }
        .nav-btn {
            padding: 8px 14px; border: none; border-radius: 10px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all .2s ease; display: flex; align-items: center; gap: 4px;
        }
        .nav-btn:active { transform: scale(.95); }
        .nav-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
        .nav-btn.prev { background: linear-gradient(135deg, #e8e2da, #ddd6cc); color: #5a554e; }
        .nav-btn.prev:hover { background: linear-gradient(135deg, #ddd6cc, #d0c9bf); }
        .nav-btn.next { background: linear-gradient(135deg, #6d9e86, var(--c-primary)); color: #fff; box-shadow: 0 2px 8px rgba(91,138,114,.25); }
        .nav-btn.next:hover { background: linear-gradient(135deg, #7fb398, #6d9e86); box-shadow: 0 4px 12px rgba(91,138,114,.35); }
        .nav-btn.warm { color: #fff; box-shadow: 0 2px 8px rgba(196,145,94,.25); }
        .nav-btn.jump { background: linear-gradient(135deg, #d4a574, var(--c-warm)); }
        .nav-btn.jump:hover { background: linear-gradient(135deg, #dfb88c, #d4a574); }
        .nav-btn.restart { background: linear-gradient(135deg, var(--c-warm), #b07d4a); }
        .nav-btn.restart:hover { background: linear-gradient(135deg, #d4a574, var(--c-warm)); }
        .progress-info {
            font-size: 13px; color: var(--c-text-sub); background: #ede7df;
            padding: 6px 12px; border-radius: var(--r-full); white-space: nowrap;
        }

        /* ===== 搜索高亮 ===== */
        mark { background: #ffeaa7; color: var(--c-text); padding: 1px 2px; border-radius: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="headerTitle">刷题练习</h1>
        <div class="header-controls">
            <div class="mode-switch">
                <button class="mode-btn active" data-mode="normal">常规</button>
                <button class="mode-btn" data-mode="knowledge">知识点</button>
                <button class="mode-btn" data-mode="search">搜索</button>
            </div>
            <label class="toggle-answer">
                <input type="checkbox" id="showAnswer" checked>
                <span>显示答案</span>
            </label>
        </div>
    </div>
    <div class="filter-bar kp-bar" id="kpBar">
        <span class="kp-label">知识点:</span>
    </div>
    <div class="filter-bar search-bar" id="searchBar">
        <input type="text" class="search-input" id="searchInput" placeholder="输入关键词搜索题目和答案..." />
        <span class="search-count" id="searchCount"></span>
        <button class="search-clear" id="searchClear">清除</button>
    </div>
    <div class="jump-modal" id="jumpModal">
        <div class="jump-content">
            <div class="jump-title">跳转到第几题</div>
            <input type="number" class="jump-input" id="jumpInput" min="1" max="300" placeholder="1-300">
            <div class="jump-buttons">
                <button class="jump-btn cancel" id="jumpCancel">取消</button>
                <button class="jump-btn confirm" id="jumpConfirm">跳转</button>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="stats">
            <span>选择题: <span class="count" id="choiceCount">0</span> 道</span>
            <span>判断题: <span class="count" id="judgeCount">0</span> 道</span>
            <span>总计: <span class="count" id="totalCount">0</span> 道</span>
        </div>
        <div id="questionList"></div>
    </div>
    <div class="footer">
        <button class="nav-btn prev" id="prevBtn">◀ 上一题</button>
        <span class="progress-info" id="progressInfo">1 / 300</span>
        <button class="nav-btn next" id="nextBtn">下一题 ▶</button>
        <button class="nav-btn warm jump" id="jumpBtn">跳转</button>
        <button class="nav-btn warm restart" id="restartBtn">重做</button>
    </div>
<script>
// ==================== 题目数据（数据层） ====================
const QUIZ_DATA = [{"num":1,"type":"choice","title":"以下有关计算机软件著作权的叙述中,正确的是。","options":[{"label":"A.","content":"非法进行拷贝、发布或更改软件的人被称为软件盗版者"},{"label":"B.","content":"《计算机软件保护条例》是国家知识产权局颁布的,用来保护软件著作权人的权益"},{"label":"C.","content":"软件著作权属于软件开发者,软件著作权自软件开发完成之日起产生"},{"label":"D.","content":"用户购买了具有版权的软件,则具有对该软件的使用权和复制权"}],"correctIndex":0,"keyword":"正确的是 → A..非法进行拷贝","answerText":"正确答案: A. 非法进行拷贝、发布或更改软件的人被称为软件盗版者","analysis":"软件盗版者是指未经授权非法拷贝、发布或更改软件的人，侵犯了著作权人的复制权和发行权。著作权保护的对象是软件作品的表达形式。"},{"num":2,"type":"judge","title":"希望系统尽快投入使用并在使用过程中改善，最适宜采用瀑布模型。","options":[{"label":"√","content":"正确"},{"label":"×","content":"错误"}],"correctIndex":1,"keyword":"最适宜采用瀑布模型 → ✗错误","answerText":"错误","analysis":"题目要求\"尽快投入使用并在使用中改善\"，这适合原型模型或增量模型。瀑布模型要求需求明确、一次性交付，不适合这种情况。"},{"num":3,"type":"choice","title":"M公司将其开发的某软件产品注册商标为S，为确保公司在市场竞争中占据地位，M公司对员工进行了保密约束，此情形下，该公司不享有","options":[{"label":"A.","content":"软件著作权"},{"label":"B.","content":"专利权"},{"label":"C.","content":"商业秘密权"},{"label":"D.","content":"商标权"}],"correctIndex":1,"keyword":"此情形下 → B..专利权","answerText":"正确答案: B. 专利权","analysis":"县级以上行政区划地名或公众知晓的外国地名不得作为商标注册。青岛是山东省地级市（县级市以上），不能注册为商标。"},{"num":4,"type":"choice","title":"若模块A和模块B通过外部变量来交换输入、输出信息，则这两个模块的耦合类型是耦合。","options":[{"label":"A.","content":"数据"},{"label":"B.","content":"标记"},{"label":"C.","content":"控制"},{"label":"D.","content":"公共"}],"correctIndex":3,"keyword":"输出信息 → D..公共","answerText":"正确答案: D. 公共","analysis":"模块间通过外部变量（全局变量）交换信息属于公共耦合。数据耦合是传参数，标记耦合是传数据结构地址，控制耦合是传控制标志。"},{"num":5,"type":"judge","title":"重放属于主动攻击","options":[{"label":"√","content":"正确"},{"label":"×","content":"错误"}],"correctIndex":0,"keyword":"重放属于主动攻击 → ✓正确","answerText":"正确","analysis":"重放攻击将合法报文重新发送，属于主动攻击（篡改通信内容）。被动攻击如窃听、流量分析只监听不干扰。"}];
const QUIZ_DATA_EXT = [{"num":6,"type":"choice","title":"设栈初始时为空，对于入栈序列1，2，3…n这些元素经过栈之后得到出栈序列P1,P2,P3，.…Pn，若P3=4，则P1，P2不可能的取值为。","options":[{"label":"A.","content":"6,5"},{"label":"B.","content":"2,3"},{"label":"C.","content":"3,1"},{"label":"D.","content":"3,5"}],"correctIndex":2,"keyword":"…Pn → C..3,1","answerText":"正确答案: C. 3,1","analysis":"P3=4，即第3个出栈元素是4。若P1=3,P2=1：3入→3出(P1)→1入→1出(P2)→2入→4入→4出(P3)→...但2在4之前必须出栈，矛盾。故C不可能。"},{"num":7,"type":"choice","title":"在风险管理中，通常需要进行风险监测，其目的不包括","options":[{"label":"A.","content":"消除风险"},{"label":"B.","content":"评估所预测的风险是否发生"},{"label":"C.","content":"保证正确实施了风险缓解步骤"},{"label":"D.","content":"收集用于后续进行风险分析的信息"}],"correctIndex":0,"keyword":"通常需要进行风险监测 → A..消除风险","answerText":"正确答案: A. 消除风险","analysis":"风险监测的目的是评估、跟踪和控制风险，但不可能\"消除\"所有风险。风险只能降低概率或减轻影响。"},{"num":8,"type":"choice","title":"在UML图中，图用于展示所交付系统中软件和硬件之间的物理关系。","options":[{"label":"A.","content":"类"},{"label":"B.","content":"组件"},{"label":"C.","content":"通信"},{"label":"D.","content":"部署"}],"correctIndex":3,"keyword":"在UML图中 → D..部署","answerText":"正确答案: D. 部署","analysis":"UML部署图(Deployment Diagram)展示系统中软件和硬件节点之间的物理关系，即软件部署在哪些硬件上。"},{"num":9,"type":"choice","title":"以下关于两个浮点数相加运算的叙述中，正确的是","options":[{"label":"A.","content":"首先进行对阶，阶码大的向阶码小的对齐"},{"label":"B.","content":"首先进行对阶，阶码小的向阶码大的对齐"},{"label":"C.","content":"不需要对阶，直接将尾数相加"},{"label":"D.","content":"不需要对阶，直接将阶码相加"}],"correctIndex":1,"keyword":"正确的是 → B..首先进行对阶","answerText":"正确答案: B. 首先进行对阶，阶码小的向阶码大的对齐","analysis":"浮点数加法对阶时，小阶向大阶对齐（小阶值增大），尾数相应右移。右移可以防止大阶的尾数高位有效数字丢失。"},{"num":10,"type":"choice","title":"Python语言的特点不包括。","options":[{"label":"A.","content":"跨平台、开源"},{"label":"B.","content":"编译型"},{"label":"C.","content":"支持面向对象程序设计"},{"label":"D.","content":"动态编程"}],"correctIndex":1,"keyword":"Python语言的特点不… → B..编译型","answerText":"正确答案: B. 编译型","analysis":"Python是解释型语言（非编译型），运行时由解释器逐行执行。解释型语言跨平台性好，但运行速度一般比编译型语言慢。"},{"num":11,"type":"judge","title":"在面向对象方法中，继承是父类和子类之间共享数据和方法的机制。","options":[{"label":"√","content":"正确"} choice","title":"以下关于软件风险的叙述中，不正确的是","options":[{"label":"A.","content":"风险是可能发生的事件"},{"label":"B.","content":"如果发生风险，风险的本质、范围和时间可能会影响风险所产生的后果"},{"label":"C.","content":"如果风险可以预测，可以避免其发生"},{"label":"D.","content":"可以对风险进行控制"}],"correctIndex":2,"keyword":"不正确的是 → C..可以避免其发生","answerText":"正确答案: C. 如果风险可以预测，可以避免其发生","analysis":"即使可以预测风险也不能完全避免其发生。风险管理是降低概率和影响，不是消除风险。"},{"num":209,"type":"judge","title":"软件体系结构的各种风格中，仓库风格包含一个数据仓库和若干个其他构件。数据仓库位于该体系结构的中心，其他构件访问该数据仓库并对其中的数据进行增、删、改等操作。数据库系统属于仓库风格。","options":[{"label":"√","content":"正确"},{"label":"×","content":"错误"}],"correctIndex":0,"keyword":"改等操作 → ✓正确","answerText":"正确","analysis":"仓库风格以中心数据仓库为核心。数据库系统：中心数据库+多个客户端应用，属于典型的仓库风格。"},{"num":210,"type":"choice","title":"在软件设计阶段进行模块划分时，一个模块的。","options":[{"label":"A.","content":"控制范围应该在其作用范围之内"},{"label":"B.","content":"作用范围应该在其控制范围之内"},{"label":"C.","content":"作用范围与控制范围互不包含"},{"label":"D.","content":"作用范围与控制范围不受任何限制"}],"correctIndex":1,"keyword":"在软件设计阶段进行模块划… → B..作用范围应该在其控制范围之内","answerText":"正确答案: B. 作用范围应该在其控制范围之内","analysis":"作用范围应在控制范围之内——判断条件影响的模块应是其所在模块的下级（控制范围之内）。"},{"num":211,"type":"choice","title":"在Python3，不是合法的异常处理结构。","options":[{"label":"A.","content":"try...except…"},{"label":"B.","content":"try...except...finally"},{"label":"C.","content":"try...catch..."},{"label":"D.","content":"raise"}],"correctIndex":2,"keyword":"在Python3 → C..try","answerText":"正确答案: C. try...catch...","analysis":"Python用try...except...finally处理异常，try...catch是Java/C++语法，Python没有catch关键字。"},{"num":212,"type":"judge","title":"DES是公开密钥加密算法。","options":[{"label":"√","content":"正确"},{"label":"×","content":"错误"}],"correctIndex":1,"keyword":"DES是公开密钥加密… → ✗错误","answerText":"错误","analysis":"DES是对称加密算法（加密解密用同一密钥），RSA/ECC才是公开密钥(非对称)加密算法。"},{"num":213,"type":"choice","title":"下面关于IP地址和MAC地址说法错误的是。","options":[{"label":"A.","content":"IP地址长度32或128位，MAC地址的长度48位"},{"label":"B.","content":"IP 地址工作在网络层, MAC地址工作在数据链路层"},{"label":"C.","content":"IP地址的分配是基于网络拓扑，MAC地址的分配是基于制造商"},{"label":"D.","content":"I nt":"正确"},{"label":"×","content":"错误"}],"correctIndex":0,"keyword":"数字语音的采样频率定… → ✓正确","answerText":"正确","analysis":"奈奎斯特采样定理：采样频率≥2×信号最高频率。语音最高4kHz→采样频率≥8kHz（实际用8kHz）。"},{"num":250,"type":"choice","title":"设信息位是8位，用海明码来发现并纠正1位出错的情况，则校验位的位数至少为。","options":[{"label":"A.","content":"1"},{"label":"B.","content":"2"},{"label":"C.","content":"4"},{"label":"D.","content":"8"}],"correctIndex":2,"keyword":"设信息位是8位 → C..4","answerText":"正确答案: C. 4","analysis":"海明码校验位r需满足2^r≥8+r+1=9+r。r=4时16≥13成立。所以8位数据至少需4位校验位。"},{"num":251,"type":"choice","title":"按照我国著作权法的权利保护期，以下权利中，受到永久保护。","options":[{"label":"A.","content":"发表权"},{"label":"B.","content":"修改权"},{"label":"C.","content":"复制权"},{"label":"D.","content":"发行权"}],"correctIndex":1,"keyword":"受到永久保护 → B..修改权","answerText":"正确答案: B. 修改权","analysis":"修改权属于著作人身权，保护期不受时间限制（永久保护）。发表权、复制权等财产权有保护期限。"},{"num":252,"type":"choice","title":"对某有序顺序表进行折半查找（二分查找）时，进行比较的关键字序列不可能是","options":[{"label":"A.","content":"42,61,90,85,77"},{"label":"B.","content":"42,90,85,61,77"},{"label":"C.","content":"90,85,61,77,42"},{"label":"D.","content":"90,85,77,61,42"}],"correctIndex":2,"keyword":"二分查找 → C..90","answerText":"正确答案: C. 90,85,61,77,42","analysis":"折半查找过程分析需画判定树。第一次与中间元素(55)比较→根据大小关系选择左半或右半→递归。需验证每步。"},{"num":253,"type":"choice","title":"某Python程序中定义了X= [1，2]，那么X*2的值为。","options":[{"label":"A.","content":"[1, 2, 1, 2]"},{"label":"B.","content":"[1, 1, 2, 2]"},{"label":"C.","content":"[2, 4]"},{"label":"D.","content":"出错"}],"correctIndex":0,"keyword":"[1 → A..[1","answerText":"正确答案: A. [1, 2, 1, 2]","analysis":"Python中列表乘以n表示重复n次：[1,2]*2=[1,2,1,2]。不是元素乘以2。"},{"num":254,"type":"choice","title":"以下关于软件测试的叙述中，不正确的是（  ）","options":[{"label":"A.","content":"在设计测试用例时应考虑输入数据和预期输出结果"},{"label":"B.","content":"软件测试的目的是证明软件的正确性"},{"label":"C.","content":"在设计测试用例时，应该包括合理的输入条件"},{"label":"D.","content":"在设计测试用例时，应该包括不合理的输入条件"}],"correctIndex":1,"keyword":"不正确的是 → B..软件测试的目的是…","answerText":"正确答案: B. 软件测试的目的是证明软件的正确性","analysis":"软件测试目的是发现软件中的缺陷，不是证明软件正确性。好 // ==================== 工具函数 ====================
const $ = id => document.getElementById(id);
const listEl = $('questionList');

function escHTML(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

function highlightHTML(text, keyword) {
    if (!keyword) return escHTML(text);
    const escaped = escHTML(text);
    const kw = escHTML(keyword);
    const regex = new RegExp('(' + kw.replace(/[.*+?${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return escaped.replace(regex, '<mark>$1</mark>');
}

// ==================== 渲染逻辑（视图层） ====================

// 统一卡片渲染（支持关键词高亮）
function buildCardHTML(q, idx, origIdx, keyword) {
    const kw = keyword || '';
    const typeLabel = q.type === 'choice' ? '单选题' : '判断题';
    const typeClass = q.type === 'choice' ? 'type-choice' : 'type-judge';
    const optionsHTML = q.options.map((opt, oi) => {
        const cls = oi === q.correctIndex ? 'option correct' : 'option';
        return `<div class="${cls}" data-qi="${origIdx}" data-oi="${oi}">
            <span class="option-label">${escHTML(opt.label)}</span>
            <span class="option-content">${kw ? highlightHTML(opt.content, kw) : escHTML(opt.content)}</span>
        </div>`;
    }).join('\n');
    const analysisHTML = q.analysis ? `<div class="answer-note answer-analysis">${escHTML(q.analysis)}</div>` : '';
    return `<div class="question-card" data-idx="${idx}" data-orig="${origIdx}" style="display:${idx === 0 ? 'block' : 'none'}">
        <div class="question-header">
            <span class="question-type ${typeClass}">${typeLabel}</span>
            <span class="question-number">第 ${q.num} / ${total} 题</span>
        </div>
        <div class="question-title">${kw ? highlightHTML(q.title, kw) : escHTML(q.title)}</div>
        <div class="options">${optionsHTML}</div>
        <div class="answer-section show">
            <div class="answer-label">正确答案</div>
            <div class="answer-text">${kw ? highlightHTML(q.answerText, kw) : escHTML(q.answerText)}</div>
            <div class="answer-note answer-keyword">${kw ? highlightHTML(q.keyword, kw) : escHTML(q.keyword)}</div>
            ${analysisHTML}
        </div>
    </div>`;
}

function renderAllCards() {
    const kw = mode === 'search' ? currentKeyword : '';
    listEl.innerHTML = filteredData.map((q, i) => {
        const origIdx = allData.indexOf(q);
        return buildCardHTML(q, i, origIdx, kw);
    }).join('');
}

function updateStats() {
    const c = filteredData.filter(q => q.type === 'choice').length;
    $('choiceCount').textContent = c;
    $('judgeCount').textContent = filteredData.length - c;
    $('totalCount').textContent = filteredData.length;
}

// 统计初始化

function switchMode(newMode) {
    if (mode === newMode) return;
    mode = newMode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const kpBar = $('kpBar'), searchBar = $('searchBar');

    // 先隐藏所有筛选栏
    kpBar.classList.remove('show');
    searchBar.classList.remove('show');
    document.body.classList.remove('kp-active');

    if (mode === 'knowledge') {
        kpBar.classList.add('show');
        document.body.classList.add('kp-active');
        $('headerTitle').style.fontSize = '15px';
        currentKeyword = '';
        if (!currentKP) {
            const first = Object.entries(KNOWLEDGE_POINTS).sort((a, b) => b[1].length - a[1].length)[0][0];
            selectKP(first);
        }
    } else if (mode === 'search') {
        searchBar.classList.add('show');
        document.body.classList.add('kp-active');
        $('headerTitle').style.fontSize = '15px';
        currentKP = null;
        $('searchInput').value = '';
        $('searchCount').textContent = '';
        currentKeyword = '';
        resetToAll('关键词搜索');
        setTimeout(() => $('searchInput').focus(), 100);
    } else {
        $('headerTitle').style.fontSize = '';
        currentKP = null;
        currentKeyword = '';
        document.querySelectorAll('.kp-chip').forEach(c => c.classList.remove('active'));
        resetToAll('刷题练习');
    }
}

// ==================== 知识点模式 ====================

function initKPBar() {
    const bar = $('kpBar');
    Object.entries(KNOWLEDGE_POINTS)
        .sort((a, b) => b[1].length - a[1].length)
        .forEach(([kp, nums]) => {
            const chip = document.createElement('span');
            chip.className = 'kp-chip';
            chip.dataset.kp = kp;
            chip.innerHTML = `${kp}<span class="kp-count">(${nums.length})</span>`;
            chip.onclick = () => selectKP(kp);
            bar.appendChild(chip);
        });
}

function selectKP(kp) {
    if (currentKP === kp) return;
    currentKP = kp;
    $('headerTitle').textContent = kp;
    document.querySelectorAll('.kp-chip').forEach(c => c.classList.toggle('active', c.dataset.kp === kp));
    const nums = new Set(KNOWLEDGE_POINTS[kp]);
    filteredData = allData.filter(q => nums.has(q.num));
    currentIndex = 0;
    updateStats();
    renderAllCards();
    updateUI();
}

// ==================== 搜索模式 ====================

let searchTimer = null;
$('searchInput').oninput = e => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => doSearch(e.target.value.trim()), 200);
};
$('searchClear').onclick = () => {
    $('searchInput').value = '';
    $('searchCount').textContent = '';
    currentKeyword = '';
    resetToAll($('headerTitle').textContent);
    $('searchInput').focus();
};

function doSearch(keyword) {
    currentKeyword = keyword;
    if (!keyword) {
        $('searchCount').textContent = '';
        filteredData = [...allData];
    } else {
        const kw = keyword.toLowerCase();
        filteredData = allData.filter(q =>
            q.title.toLowerCase().includes(kw) ||
            q.answerText.toLowerCase().includes(kw) ||
            q.keyword.toLowerCase().includes(kw)
        );
        $('searchCount').textContent = filteredData.length + ' 题';
    }
    currentIndex = 0;
    updateStats();
    renderAllCards();
    updateUI();
}

// ==================== 交互逻辑（控制层） ====================

function updateUI() {
    const cards = getCards();
    const ft = filteredData.length;
    cards.forEach((c, i) => c.style.display = i === currentIndex ? 'block' : 'none');
    const ac = Object.keys(answered).length;
    $('progressInfo').textContent = (currentIndex + 1) + ' / ' + ft + ' (已答: ' + ac + ')';
    $('prevBtn').disabled = currentIndex === 0;
    $('nextBtn').disabled = currentIndex === ft - 1;
    restoreState();
    document.querySelector('.main-content').scrollTop = 0;
}

function restoreState() {
    const card = getCards()[currentIndex];
    if (!card) return;
    const qi = card.dataset.orig;
    card.querySelectorAll('.option').forEach(o => {
        o.classList.remove('user-correct', 'user-wrong', 'selected');
        if (answered[qi]) {
            const answer = answered[qi];
            if (o.dataset.oi == answer) {
                o.classList.add(o.classList.contains('correct') ? 'user-correct' : 'user-wrong');
                o.classList.add('selected');
            }
        }
    });
}

// 点击选项
listEl.addEventListener('click', e => {
    const opt = e.target.closest('.option');
    if (!opt) return;
    const qi = opt.dataset.qi, oi = opt.dataset.oi;
    if (answered[qi] !== undefined) return;
    answered[qi] = +oi;
    save();
    opt.classList.add(opt.classList.contains('correct') ? 'user-correct' : 'user-wrong', 'selected');
    // 自动翻到下一题
    if (currentIndex < filteredData.length - 1) setTimeout(() => { currentIndex++; updateUI(); }, 350);
});

// 模式切换按钮
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => switchMode(btn.dataset.mode);
});

// 导航按钮
$('prevBtn').onclick = () => { if (currentIndex > 0) { currentIndex--; updateUI(); } };
$('nextBtn').onclick = () => { if (currentIndex < filteredData.length - 1) { currentIndex++; updateUI(); } };

// 重做
$('restartBtn').onclick = () => {
    if (!confirm('确定要清除所有做题记录吗？')) return;
    answered = {}; localStorage.removeItem('quizAnswers');
    getCards().forEach(c => c.querySelectorAll('.option').forEach(o => o.classList.remove('user-correct', 'user-wrong', 'selected')));
    updateUI();
};

// 显示/隐藏答案
$('showAnswer').onchange = e => {
    showAnswer = e.target.checked;
    document.body.classList.toggle('hide-answer', !showAnswer);
    document.querySelectorAll('.answer-section').forEach(s => s.classList.toggle('show', showAnswer));
    getCards().forEach(c => c.querySelectorAll('.option').forEach(o => o.classList.remove('user-correct', 'user-wrong', 'selected')));
    updateUI();
};

// 跳转
$('jumpBtn').onclick = () => {
    $('jumpInput').max = filteredData.length;
    $('jumpInput').placeholder = '1-' + filteredData.length;
    $('jumpInput').value = currentIndex + 1;
    $('jumpModal').classList.add('show');
    $('jumpInput').focus();
    $('jumpInput').select();
};
$('jumpCancel').onclick = () => $('jumpModal').classList.remove('show');
$('jumpConfirm').onclick = () => {
    const n = parseInt($('jumpInput').value);
    if (n >= 1 && n <= filteredData.length) { currentIndex = n - 1; updateUI(); $('jumpModal').classList.remove('show'); }
    else alert('请输入有效的题号 (1-' + filteredData.length + ')');
};
$('jumpInput').onkeydown = e => {
    if (e.key === 'Enter') $('jumpConfirm').click();
    if (e.key === 'Escape') $('jumpModal').classList.remove('show');
};
$('jumpModal').onclick = e => { if (e.target === $('jumpModal')) $('jumpModal').classList.remove('show'); };

// 键盘导航
document.addEventListener('keydown', e => {
    if ($('jumpModal').classList.contains('show')) return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { if (currentIndex > 0) { currentIndex--; updateUI(); } }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); if (currentIndex < filteredData.length - 1) { currentIndex++; updateUI(); } }
});

// ==================== 初始化 ====================
initKPBar();
renderAllCards();
updateUI();
</script>
</body>
</html>
